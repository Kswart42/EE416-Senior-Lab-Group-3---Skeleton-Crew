; PlatformIO Project Configuration File
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Adafruit #5364 uses the ESP32-S3-WROOM-2 (N32R16V): 32MB OCTAL flash +
; 16MB OCTAL PSRAM. The stock devkitc-1 board definition assumes the
; smaller quad-flash module, which can cause boot loops / flash errors.
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 32MB
board_build.partitions = default.csv

; Serial output goes over the native port labeled "USB" with these flags.
; To use the "UART" port instead, delete both -D flags below.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
